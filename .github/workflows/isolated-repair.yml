name: Isolated ACP source and offline CLI verification
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: isolated-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify frozen ACP source and run bounded offline checks
